# ---------------------------------------------------------------
# OPCION A (por defecto): conexion via puertos publicados en localhost.
# Funciona en Linux, Mac y Windows (WSL + Docker Desktop).
# ---------------------------------------------------------------
[servidores]
servidor1 ansible_host=127.0.0.1 ansible_port=2201 ip_interna=172.20.0.11
servidor2 ansible_host=127.0.0.1 ansible_port=2202 ip_interna=172.20.0.12
servidor3 ansible_host=127.0.0.1 ansible_port=2203 ip_interna=172.20.0.13
servidor4 ansible_host=127.0.0.1 ansible_port=2204 ip_interna=172.20.0.14
servidor5 ansible_host=127.0.0.1 ansible_port=2205 ip_interna=172.20.0.15

# ---------------------------------------------------------------
# OPCION B: conexion directa por IP de los contenedores
# (solo funciona si corres Docker nativo en Linux).
# Para usarla: comenta el bloque [servidores] de arriba y descomenta este.
# ---------------------------------------------------------------
# [servidores]
# servidor1 ansible_host=172.20.0.11
# servidor2 ansible_host=172.20.0.12
# servidor3 ansible_host=172.20.0.13
# servidor4 ansible_host=172.20.0.14
# servidor5 ansible_host=172.20.0.15

[servidores:vars]
ansible_user=ansible
ansible_password=ansible
ansible_become=true
ansible_become_method=sudo
